name: Deploy to Azure Static Web Apps

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy site
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Configure Application Insights
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
        run: |
          printf 'window.APPINSIGHTS_CONNECTION_STRING = %s;\n' \
            "$(node -e 'process.stdout.write(JSON.stringify(process.env.APPINSIGHTS_CONNECTION_STRING || ""))')" \
            > site/js/app-config.js

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site
          api_location: ""
          output_location: ""
