<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maryland Demographics Visualization</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container"> <!-- Centers content and sets max width -->
        <h2><strong>Maryland Demographics</strong></h2>

        <div id="controls">
            <!-- placeholder the demographic dropdown button -->
            Demographic: <select id="demographic_dropdown" class="variable"></select>
        </div>

        <div id="vis"></div> <!--  Will hold our visualization (SVG) -->

        <div id="tooltip" style="display:none"></div> 
    </div>

    <!-- Load D3.js -->
    <script src="https://d3js.org/d3.v7.js"></script>
    <script src="js/script.js"></script>
</body>
